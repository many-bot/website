<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManyPlug - ManyBot plugin repository</title>
  <meta name="description" content="Browse the ManyBot plugin repository and extend your bot's capabilities.">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="/assets/favicon.png">
</head>
<body>
<!-- NAV -->
<main><div class="container">
  <div class="page-header">
    <h1>ManyPlug</h1>
    <p>ManyBot plugins. Install with <a href="/en/manyplug/">ManyPlug</a> - <a href="/docs/how-to-make-a-plugin">How to build a plugin (PT)</a></p>
  </div>

  <div id="plugins-grid" class="plugins-grid">
    <div class="empty-notice">loading plugins...</div>
  </div>
</div></main>
<!-- FOOTER -->

<script>
(function () {
  var API = "https://api.manybot.org";

  function escHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderCard(p) {
    var author = p.author.name;
    return '<a class="plugin-card" href="/plugins/' + escHtml(p.key) + '/">'
      + '<div class="plugin-card-header">'
      + '<span class="plugin-card-name">' + escHtml(p.name) + '</span>'
      + '<span class="plugin-card-version">v' + escHtml(p.version || '?') + '</span>'
      + '</div>'
      + '<div class="plugin-card-desc">' + escHtml(p.description || '') + '</div>'
      + '<div class="plugin-card-footer">'
      + (author ? '<span class="plugin-card-author">by ' + escHtml(author) + '</span>' : '')
      + '<span class="plugin-tag">' + escHtml(p.category || '') + '</span>'
      + '</div>'
      + '</a>';
  }

  async function load() {
    var grid = document.getElementById("plugins-grid");
    var plugins;
    try {
      var res = await fetch(API + "/plugins");
      if (!res.ok) throw new Error(res.status);
      plugins = await res.json();
    } catch (e) {
      grid.innerHTML = '<div class="empty-notice">failed to load plugins.</div>';
      return;
    }
    grid.innerHTML = plugins.map(renderCard).join("");
  }

  load();
}());
</script>
</body>
</html>
