<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- TITLE --></title>
  <meta name="description" content="ManyBot - Automate your messages your way.">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/nord.css">
</head>
<body>
<!-- NAV -->
<main>
  <div class="docs-layout">
    <!-- SIDEBAR -->
    <div class="docs-content">
      <!-- CONTENT -->
    </div>
  </div>
</main>
<!-- FOOTER -->
<script>
(function () {
  var input = document.getElementById("docs-search-input");
  var results = document.getElementById("docs-search-results");
  if (!input || !results) return;

  var base = input.dataset.base || "";
  var emptyMsg = input.dataset.empty || "";
  var index = null;
  var indexPromise = null;

  function loadIndex() {
    if (!indexPromise) {
      indexPromise = fetch(base + "/docs/search-index.json")
        .then(function (r) { return r.json(); })
        .then(function (data) { index = data; return data; })
        .catch(function () { index = []; return []; });
    }
    return indexPromise;
  }

  function norm(s) {
    return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function excerpt(text, q) {
    var t = norm(text);
    var i = t.indexOf(q);
    if (i === -1) return text.slice(0, 100);
    var start = Math.max(0, i - 40);
    return (start > 0 ? "…" : "") + text.slice(start, start + 140) + "…";
  }

  function render(list, q) {
    if (!list.length) {
      results.innerHTML = '<div class="docs-search-empty">' + emptyMsg + "</div>";
      results.hidden = false;
      return;
    }
    results.innerHTML = list.map(function (item) {
      return '<a class="docs-search-result" href="' + base + item.href + '">' +
        '<div class="docs-search-result-title">' + item.title + "</div>" +
        '<div class="docs-search-result-excerpt">' + excerpt(item.text, q) + "</div>" +
        "</a>";
    }).join("");
    results.hidden = false;
  }

  var timer = null;
  input.addEventListener("input", function () {
    var q = norm(input.value.trim());
    clearTimeout(timer);
    if (!q) { results.hidden = true; results.innerHTML = ""; return; }
    timer = setTimeout(function () {
      loadIndex().then(function (data) {
        var matches = data.filter(function (item) {
          return norm(item.title).indexOf(q) !== -1 || norm(item.text).indexOf(q) !== -1;
        }).slice(0, 8);
        render(matches, q);
      });
    }, 120);
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".docs-search")) results.hidden = true;
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { results.hidden = true; input.blur(); }
  });
})();
</script>
</body>
</html>
