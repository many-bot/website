<h1>ManyBot REST API</h1>

Get info about ManyBot plugins index.

<h2>Endpoints:</h2>

<ul>
  <li>/plugins</li>
  <li>/plugins/:key</li>
  <li>/plugins/:key/comments</li>
</ul>

<p>":key" here means author/plugin</p>

<p>Example:</p>

<pre>
  curl https://api.manybot.org/plugins/synt-xerror/manymedia
</pre>
